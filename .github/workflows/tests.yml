name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  bpy-smoke:
    name: bpy smoke test (Blender 5.0)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GL/X libraries required by bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libice6 libsm6 libxfixes3 libxi6 libxrender1 \
            libxkbcommon0 libxt6

      - name: Install Blender as a Python module
        run: pip install bpy==5.0.1

      - name: Run full test suite (geometry + add-on smoke tests)
        run: python -m unittest discover -s tests -v

      - name: Build add-on release zips
        run: python better_anotate/package.py
